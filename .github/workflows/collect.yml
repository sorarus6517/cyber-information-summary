name: collect

# 1日1回、各機関の公式フィードを取得して data/ とページを更新する。
# 手動でも実行できる(Actions タブの「Run workflow」)。
on:
  schedule:
    - cron: "15 21 * * *"   # UTC 21:15 = 日本時間 翌朝6:15
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を用意
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 収集を実行
        run: python collect.py

      - name: ページを生成
        run: python build.py

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data w archive.html notify.html feed.xml sitemap.xml robots.txt
          if [ -n "$(git diff --cached --name-only)" ]; then
            git commit -m "data: 自動更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "変更なし"
          fi
